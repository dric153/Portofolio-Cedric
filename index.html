        .input{
            visibility: hidden;
        }
        .label{
            position: absolute;
            width: 80px;
            height: 40px;
            background-color: gray;
            border-radius: 20px;
            cursor: pointer;
        }
        .circle{
            width: 34px;
            background-color: #fff;
            height: 34px;
            border-radius: 50%;
            top: 3px;
            position: absolute;
            left: 3px;
            animation: toggleOff 0.4s linear forwards;
        }
        .input:checked + .label{
            background-color: gray;
        }
        .input:checked + .label .circle{
            animation: toggleOn 0.4s linear forwards;
            background-color: black;
        }
        @keyframes toggleOn{
            0%{
                transform: translateX(0);
            }100%{
                transform: translateX(40px);
            }
        }
        @keyframes toggleOff{
            0%{
                transform: translateX(40px);
            }100%{
                transform: translateX(0);
            }
        }

    <script>
        const calc_in = document.getElementById('calc-in')
        const calc_out = document.getElementById('calc-out')
        const lirik = document.getElementById('lirik')
        const audioplayer = document.getElementById('audioplayer')
        const a = document.getElementById('a')
        const blacky = document.querySelector('#lagu')
        const hindi = document.getElementById('repet')
        const soundboard = document.getElementById('soundboard')
        const sounds = [
            {src: 'youre-taking-too-long.mp3'},
        ]
        const lagu =  [
            {src: '3. My Castle Town (DELTARUNE Chapter 2 Soundtrack) - Toby Fox.mp3', name:"My Castle Town"},
            {src: 'Hip Shop.mp3', name:"Hip Shop"},
            {src: '071. Undertale (UNDERTALE Soundtrack) - Toby Fox.mp3', name:"Undertale"},
            {src: 'OMORI OST - 005 By Your Side..mp3', name:"By Your Side"},
            {src: 'OMORI OST - 013 A Home For Flowers (Tulip).mp3', name:"A Home For Flowers (Tulip)"},
            {src: 'OMORI OST - 016 A Place By A Lake.mp3', name:"A Place By The Lake"},
            {src: 'OMORI OST - 021 Sugar Star Planetarium.mp3', name:"Sugar Star Planetarium"},
            {src: 'OMORI OST - 044 Where We Used To Play.mp3', name:"Where We Used To Play"},
            {src: 'OMORI OST - 061 See You Tomorrow.mp3', name:"See You Tomorrow"},
        ]
        const looop = document.getElementById('looop')
        let soundindex = 0
        let laguindex = null
        audioplayer.play()
        if(audioplayer.paused){
        a.innerText ="▶";
        }else if(audioplayer.played){
          a.innerText ='⏸'  
        }
        lop = false
        function loop(){
            if(lop){
                lop = false
                looop.style.backgroundColor = "black";
                looop.style.color = "white";
            }else{
                lop = true
                looop.style.backgroundColor = "white";
                looop.style.color = "black";
            }
        }
        const inputEl = document.querySelector('.input')
        const bodyEl = document.querySelector('.isi')
        const utama = document.querySelector('.utama')
function createRow(no, name, singer, long) {
 const tr = document.createElement('tr');
 tr.className = 'a';
 tr.setAttribute('onclick', `loadsong(${no-1})`);

 const td1 = document.createElement('td');
 td1.className = 'num';
 td1.style.display = 'flex';
 td1.style.justifyContent = 'center';
 td1.innerText = no;

 const td2 = document.createElement('td');
 td2.innerText = name;
 const td3 = document.createElement('td');
 td3.innerText = singer;
 const td4 = document.createElement('td');
 td4.innerText = long;


 
 tr.append(td1, td2, td3, td4);
 return tr; 
 }

 const tbody = document.getElementById('table-body');
 for (let i = 1; i <= lagu.length; i++) {
 tbody.appendChild(createRow(i, lagu[i-1].name, lagu[i-1].singer, lagu[i-1].long));
 }
 

        function updateBody(){
            if(bodyEl.style.background != 'black'){
                bodyEl.style.background = 'black'
                bodyEl.style.color = 'white'
                bodyEl.style.border = '2px solid white'
                utama.style.background = 'black'
                looop.style.border = "2px solid white"
                inputEl.checked = true
                
            }else{
                bodyEl.style.background = 'lightgray'
                bodyEl.style.color = 'black'
                bodyEl.style.border = '2px solid black'
                utama.style.background = 'gray'
                looop.style.border = "none";
                inputEl.checked = false
            }
        }
        inputEl.addEventListener('input', () =>{
            updateBody();
        });

        function AddStuffToCalc(a){
            calc_in.innerText += a
        }
        function plusseconds(time){
            if(audioplayer.currentTime + time < audioplayer.duration){
                audioplayer.currentTime += time
            }else{
                audioplayer.currentTime = audioplayer.duration
            }
        }

        function minseconds(time){
            if(audioplayer.currentTime - time > 0){
                audioplayer.currentTime -= time
            }else{
                audioplayer.currentTime = 0
            }
        }

        function randomlagu(){
            return Math.floor(Math.random() * (lagu.length - 0 + 1)) + 0;
        }
        // function load(int){
        //     pl = int
        //     if(pl == 0){
        //         blacky.style.display = 1
        //         hindia.style.display = none
        //     }
        //     else{
        //         blacky.style.display = none
        //         hindia.style.display = 1
        //     }
        // }
        var repeat = false
        function repet(){
            if(repeat){
                repeat = false
                hindi.style.backgroundColor = "black";
        }else{
            repeat = true
            hindi.style.backgroundColor = "white";
        }
        }
        function loadsong(index){
            laguindex = index;
            audioplayer.pause();
            // if(playlist == "hindia"){
            //     audioplayer.src = hindia[index].src
            // }
            // else{
                audioplayer.src = lagu[index].src;
                // lirik.innerText = lagu[index].lirik
            // }
            audioplayer.load();
            audioplayer.play();
            a.innerText = '⏸'
        }
        function loadsound(index){
            soundboard.pause();
            soundboard.src = sounds[index].src;
            soundboard.load();
            soundboard.play();
        }
        function pauseSong(){
            if (audioplayer.paused && laguindex != null){
                audioplayer.play();
                a.innerText = '⏸'
            
            }else if(laguindex == null){
                loadsong(randomlagu())
            }else{
                audioplayer.pause()
                a.innerText ="▶";
            }
        }
        function checkRepeat(){
        const start = parseInt(document.getElementById('start').value)
        const end = parseInt(document.getElementById('end').value)
            if (repeat){
                audioplayer.play()
            }
            else if(lop && laguindex == end-1){
                    laguindex = start - 1
                    pilihlagu(laguindex)
                }
            else{
            nextSong()    
        }
    }
        function nextSong(){
            laguindex = (laguindex + 1 ) %lagu.length;
            loadsong(laguindex);
        }
        function prevSong(){

            laguindex = (laguindex - 1 + lagu.length) %lagu.length;
            loadsong(laguindex);
            // }
        }
        function pilihlagu(index){
            loadsong(index)
            var playlist = null
        }
        function pilihlag(index){
            var playlist = 'hindia'
            loadsong(index)

        }
        // audioplayer.addEventListener('ended',
        //     if(index)
        // )
        document.addEventListener('keydown', (event) => {
            switch(event.key){
                case " ":
                    pauseSong();
                    break;
                case "ArrowLeft":
                    minseconds(5);
                    break;
                case "ArrowRight":
                    plusseconds(5);
                    break;
                case "]":
                    loadsound(0);
                    break;
                case "r":
                    repet();
                    break;
                case "l":
                    plusseconds(10);
                    break;
                case "j":
                    minseconds(10);
                    break;
                case "1":
                    AddStuffToCalc("1");
                    break;
                case "2":
                    AddStuffToCalc("2");
                    break;
                case "3":
                    AddStuffToCalc("3");
                    break;
                case "4":
                    AddStuffToCalc("4");
                    break;
                case "5":
                    AddStuffToCalc("5");
                    break;
                case "6":
                    AddStuffToCalc("6");
                    break;
                case "7":
                    AddStuffToCalc("7");
                    break;
                case "8":
                    AddStuffToCalc("8");
                    break;
                case "9":
                    AddStuffToCalc("9");
                    break;
                case "0":
                    AddStuffToCalc("0");
                    break;
                case "+":
                    AddStuffToCalc(" + ");
                    break;
                case "-":
                    AddStuffToCalc(" - ");
                    break;
                case "*":
                    AddStuffToCalc(" * ");
                    break;
                case "/":
                    AddStuffToCalc(" / ");
                    break;
                case ".":
                    AddStuffToCalc(".");
                    break;
                case "(":
                    AddStuffToCalc("(");
                    break;
                case ")":
                    AddStuffToCalc(")");
                    break;
                case "c":
                    calc_in.innerText = "";
                    break;
                case "<":
                    prevSong();
                    break;
                case ">":
                    nextSong();
                    break;
                case "Backspace":
                    calc_in.innerText = calc_in.innerText.slice(0,-1);
                    break;
                case "d":
                    updateBody();
                    break;
                case "=":
                    try {
                        calc_out.innerText = parseFloat(eval(calc_in.innerText));
                    } catch (error) {
                        calc_out.innerText = "Error"
                    }
                    calc_in.innerText = "";
                    break;
            }
        });
        audioplayer.addEventListener('ended',checkRepeat)
    </script>

</div>
